services:
  rss-reader:
    build: .
    container_name: feed-me-maybe
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - APP_PASSWORD=${APP_PASSWORD}
      - APP_SECRET=${APP_SECRET:-}
      - ORIGIN
      - DATABASE_URL=/app/data/feed-me-maybe.db
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - feed-me-maybe-data:/app/data
    restart: unless-stopped

volumes:
  feed-me-maybe-data:
