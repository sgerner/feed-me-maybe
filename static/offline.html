<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline library · Feed Me Maybe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        max-width: 46rem;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        overflow-x: hidden;
      }
      h1,
      h2 {
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      h1 {
        margin-bottom: 0.35rem;
        font-size: 1.7rem;
      }
      h2 {
        margin-top: 1.25rem;
        margin-bottom: 0.35rem;
        font-size: 1.15rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
        margin-bottom: 1.5rem;
      }
      a {
        color: #bae6fd;
      }
      nav a,
      article h2 a,
      ul li a {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0.15rem 0;
      }
      [aria-current='page'] {
        font-weight: 700;
        text-decoration-thickness: 2px;
      }
      input {
        display: block;
        width: 100%;
        max-width: 28rem;
        box-sizing: border-box;
        padding: 0.5rem 0.75rem;
        margin: 0.5rem 0 1rem;
        font: inherit;
        color: #f8fafc;
        background: #1e293b;
        border: 1px solid #94a3b8;
        border-radius: 2px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0.35rem 0.75rem;
        font: inherit;
        font-size: 0.8125rem;
        color: #f1f5f9;
        background: #1e293b;
        border: 1px solid #64748b;
        border-radius: 2px;
        cursor: pointer;
      }
      button:hover {
        border-color: #93c5fd;
      }
      #status {
        color: #cbd5e1;
      }
      article {
        padding: 1rem 0;
        border-top: 1px solid #334155;
      }
      article p,
      .article-body {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.65;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .article-body p,
      .article-body ul,
      .article-body ol,
      .article-body blockquote,
      .article-body pre {
        margin: 0 0 1rem;
      }
      .article-body img {
        max-width: 100%;
        height: auto;
        border-radius: 2px;
        margin: 0.75rem 0;
      }
      .article-body pre {
        overflow-x: auto;
        padding: 0.75rem;
        background: #020617;
        border: 1px solid #334155;
      }
      .feed {
        margin: 0 0 0.5rem;
        color: #94a3b8;
        font-size: 0.8rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      ul {
        padding-left: 1.25rem;
      }
      ul li {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation">
        <a href="/">All</a>
        <a href="/inbox">Unread</a>
        <a href="/search">Search</a>
        <a href="/saved">Saved</a>
        <a href="/digest">Briefing</a>
      </nav>
      <h1 id="heading">Offline library</h1>
      <p id="status" role="status">
        Looking for cached stories on this device…
      </p>
      <button id="reconnect" type="button" hidden>Reload online</button>
      <label id="search-label" hidden>
        Search cached articles
        <input type="search" id="query" />
      </label>
      <section id="results" aria-labelledby="heading"></section>
    </main>
    <script>
      (() => {
        const databaseName = 'feed-me-maybe-offline';
        const cacheVersion = 'v1';
        const status = document.getElementById('status');
        const reconnect = document.getElementById('reconnect');
        const updateConnection = () => {
          reconnect.hidden = !navigator.onLine;
        };
        reconnect.addEventListener('click', () => location.reload());
        window.addEventListener('online', updateConnection);
        window.addEventListener('offline', updateConnection);
        updateConnection();

        function addStore(database, name, options, indexes = []) {
          if (database.objectStoreNames.contains(name)) return;
          const store = database.createObjectStore(name, options);
          for (const [indexName, path, indexOptions] of indexes) {
            store.createIndex(indexName, path, indexOptions);
          }
        }

        function openDatabase() {
          return new Promise((resolve, reject) => {
            const request = indexedDB.open(databaseName, 1);
            request.onupgradeneeded = () => {
              const database = request.result;
              addStore(database, 'meta', { keyPath: 'key' });
              addStore(database, 'articles', { keyPath: 'key' }, [
                ['by-scope', 'scope', { unique: false }],
                ['by-scope-updated', ['scope', 'updatedAt'], { unique: false }],
                ['by-scope-saved', ['scope', 'saved'], { unique: false }],
              ]);
              addStore(database, 'digests', { keyPath: 'key' }, [
                ['by-scope', 'scope', { unique: false }],
                ['by-scope-updated', ['scope', 'updatedAt'], { unique: false }],
              ]);
              addStore(database, 'outbox', { keyPath: 'id' }, [
                ['by-scope', 'scope', { unique: false }],
                ['by-scope-sequence', ['scope', 'sequence'], { unique: false }],
                ['by-scope-dedupe', ['scope', 'dedupeKey'], { unique: false }],
              ]);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        }

        function readLibrary(database) {
          return new Promise((resolve, reject) => {
            if (
              !database.objectStoreNames.contains('meta') ||
              !database.objectStoreNames.contains('articles')
            ) {
              resolve({ database, scope: null, articles: [], digests: [] });
              return;
            }
            const transaction = database.transaction(
              ['meta', 'articles', 'digests'],
              'readonly',
            );
            const scopeRequest = transaction
              .objectStore('meta')
              .get('active-scope');
            const articleRequest = transaction.objectStore('articles').getAll();
            const digestRequest = transaction.objectStore('digests').getAll();
            transaction.oncomplete = () => {
              resolve({
                database,
                scope: scopeRequest.result && scopeRequest.result.value,
                articles: articleRequest.result || [],
                digests: digestRequest.result || [],
              });
            };
            transaction.onerror = () => reject(transaction.error);
          });
        }

        function readableText(value) {
          return String(value || '')
            .replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi, ' ')
            .replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi, ' ')
            .replace(/<\/(?:p|li|h[1-6]|blockquote|div)>|<br\b[^>]*>/gi, '\n')
            .replace(/<[^>]*>/g, ' ')
            .replace(/&nbsp;/gi, ' ')
            .replace(/&amp;/gi, '&')
            .replace(/&lt;/gi, '<')
            .replace(/&gt;/gi, '>')
            .replace(/&quot;/gi, '"')
            .replace(/&#39;/gi, "'")
            .replace(/[^\S\n]+/g, ' ')
            .replace(/ *\n */g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
        }

        const SAFE_TAGS = new Set([
          'P',
          'BR',
          'STRONG',
          'EM',
          'B',
          'I',
          'CODE',
          'PRE',
          'BLOCKQUOTE',
          'UL',
          'OL',
          'LI',
          'H1',
          'H2',
          'H3',
          'H4',
          'A',
          'IMG',
          'FIGURE',
          'FIGCAPTION',
          'TABLE',
          'THEAD',
          'TBODY',
          'TR',
          'TH',
          'TD',
        ]);

        function resolveSafeUrl(raw, baseUrl) {
          if (!raw) return null;
          try {
            const parsed = new URL(raw, baseUrl || window.location.origin);
            return parsed.protocol === 'http:' || parsed.protocol === 'https:'
              ? parsed.toString()
              : null;
          } catch {
            return null;
          }
        }

        function sanitizeDomNode(node, baseUrl) {
          if (node.nodeType === Node.TEXT_NODE) {
            return document.createTextNode(node.textContent || '');
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return null;
          const tag = node.tagName.toUpperCase();
          if (
            tag === 'SCRIPT' ||
            tag === 'STYLE' ||
            tag === 'IFRAME' ||
            tag === 'OBJECT' ||
            tag === 'EMBED'
          ) {
            return null;
          }
          const container = SAFE_TAGS.has(tag)
            ? document.createElement(tag.toLowerCase())
            : document.createDocumentFragment();
          if (tag === 'A' && container instanceof HTMLElement) {
            const safeHref = resolveSafeUrl(node.getAttribute('href'), baseUrl);
            if (safeHref) {
              container.setAttribute('href', safeHref);
              container.setAttribute('rel', 'noopener noreferrer');
            }
          } else if (tag === 'IMG' && container instanceof HTMLElement) {
            const safeSrc = resolveSafeUrl(
              node.getAttribute('src') || node.getAttribute('data-src'),
              baseUrl,
            );
            if (!safeSrc) return null;
            container.setAttribute('src', safeSrc);
            container.setAttribute('alt', node.getAttribute('alt') || '');
            container.setAttribute('loading', 'lazy');
          } else if (tag === 'PRE' && container instanceof HTMLElement) {
            container.setAttribute('tabindex', '0');
          }
          for (const child of node.childNodes) {
            const cleanChild = sanitizeDomNode(child, baseUrl);
            if (cleanChild) container.append(cleanChild);
          }
          return container;
        }

        function renderRichBody(container, rawHtml, baseUrl) {
          container.replaceChildren();
          const source = String(rawHtml || '').trim();
          if (!source) {
            container.textContent = 'This article has no cached text.';
            return;
          }
          if (!/<[a-z][\s\S]*>/i.test(source)) {
            const p = document.createElement('p');
            p.textContent = source;
            container.append(p);
            return;
          }
          const parsed = new DOMParser().parseFromString(source, 'text/html');
          for (const child of parsed.body.childNodes) {
            const clean = sanitizeDomNode(child, baseUrl);
            if (clean) container.append(clean);
          }
          if (
            !container.textContent?.trim() &&
            !container.querySelector('img')
          ) {
            container.textContent =
              readableText(source) || 'This article has no cached text.';
          }
        }

        function dedupeGroupForType(type) {
          if (type === 'read' || type === 'unread') return 'read';
          if (type === 'save' || type === 'unsave') return 'save';
          return 'hide';
        }

        function applyActionToRecord(article, type) {
          if (type === 'read') article.read = true;
          else if (type === 'unread') article.read = false;
          else if (type === 'save') article.saved = true;
          else if (type === 'unsave') article.saved = false;
          else if (type === 'hide') article.hidden = true;
          else if (type === 'restore') {
            article.hidden = false;
            article.thumbs_down = false;
          }
          article.updatedAt = Date.now();
        }

        function queueOfflineAction(database, scope, article, type) {
          return new Promise((resolve, reject) => {
            if (!database || !scope || !article?.id) {
              resolve(false);
              return;
            }
            const tx = database.transaction(
              ['meta', 'articles', 'outbox'],
              'readwrite',
            );
            const metaStore = tx.objectStore('meta');
            const articleStore = tx.objectStore('articles');
            const outboxStore = tx.objectStore('outbox');
            const seqKey = `outbox-sequence:${scope}`;
            const seqReq = metaStore.get(seqKey);
            const allOutboxReq = outboxStore.getAll();

            seqReq.onsuccess = () => {
              allOutboxReq.onsuccess = () => {
                const existing = (allOutboxReq.result || []).filter(
                  (item) => item.scope === scope,
                );
                const dedupeKey = `${article.id}:${dedupeGroupForType(type)}`;
                for (const item of existing) {
                  if (item.dedupeKey === dedupeKey) {
                    outboxStore.delete(item.id);
                  }
                }
                const nextSeq =
                  Math.max(
                    Number((seqReq.result && seqReq.result.value) || 0),
                    0,
                    ...existing.map((item) => Number(item.sequence) || 0),
                  ) + 1;
                const now = Date.now();
                const rand = Math.random().toString(36).slice(2);
                outboxStore.put({
                  id: `offline-mutation-${now}-${rand}`,
                  idempotencyKey: `offline-idempotency-${now}-${rand}`,
                  scope,
                  articleId: article.id,
                  type,
                  dedupeKey,
                  sequence: nextSeq,
                  queuedAt: now,
                  attempts: 0,
                  nextAttemptAt: now,
                  state: 'pending',
                });
                metaStore.put({ key: seqKey, value: nextSeq });
                applyActionToRecord(article, type);
                articleStore.put(article);
              };
            };
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => reject(tx.error);
          });
        }

        function createActionBar(database, scope, article, onUpdated) {
          const bar = document.createElement('div');
          bar.className = 'actions';
          bar.setAttribute('role', 'group');
          bar.setAttribute(
            'aria-label',
            `Offline actions for ${article.title || 'story'}`,
          );

          const readBtn = document.createElement('button');
          readBtn.type = 'button';
          readBtn.textContent = article.read ? 'Mark unread' : 'Mark read';
          readBtn.addEventListener('click', () => {
            const nextType = article.read ? 'unread' : 'read';
            queueOfflineAction(database, scope, article, nextType).then(() => {
              status.textContent = 'Action queued for sync when online.';
              onUpdated();
            });
          });

          const saveBtn = document.createElement('button');
          saveBtn.type = 'button';
          saveBtn.textContent = article.saved ? 'Unsave' : 'Save';
          saveBtn.addEventListener('click', () => {
            const nextType = article.saved ? 'unsave' : 'save';
            queueOfflineAction(database, scope, article, nextType).then(() => {
              status.textContent = 'Action queued for sync when online.';
              onUpdated();
            });
          });

          const hideBtn = document.createElement('button');
          hideBtn.type = 'button';
          const isHidden = Boolean(article.hidden || article.thumbs_down);
          hideBtn.textContent = isHidden ? 'Restore' : 'Hide';
          hideBtn.addEventListener('click', () => {
            const nextType = isHidden ? 'restore' : 'hide';
            queueOfflineAction(database, scope, article, nextType).then(() => {
              status.textContent = 'Action queued for sync when online.';
              onUpdated();
            });
          });

          bar.append(readBtn, saveBtn, hideBtn);
          return bar;
        }

        const path = window.location.pathname;
        const heading = document.getElementById('heading');
        const results = document.getElementById('results');
        const query = document.getElementById('query');
        const titles = {
          '/inbox': 'Offline inbox',
          '/saved': 'Saved articles',
          '/digest': 'Offline digest',
          '/search': 'Search offline articles',
          '/recovery': 'Offline recovery',
        };
        heading.textContent = path.startsWith('/articles/')
          ? 'Offline article'
          : titles[path] || 'Offline library';
        for (const link of document.querySelectorAll('nav a')) {
          if (new URL(link.href).pathname === path)
            link.setAttribute('aria-current', 'page');
        }

        function makeArticleLink(article) {
          const link = document.createElement('a');
          link.href = '/articles/' + encodeURIComponent(article.id);
          link.textContent = article.title || 'Untitled story';
          return link;
        }

        function isVisibleInFeed(article) {
          if (article.cleared_at != null && !article.saved) return false;
          if (article.feed_enabled === false || article.feed_enabled === 0)
            return false;
          return !article.hidden && !article.thumbs_down;
        }

        function renderArticles(articles, database, scope, rerender) {
          results.replaceChildren();
          if (!articles.length) {
            const empty = document.createElement('p');
            empty.textContent = 'No cached stories in this view.';
            results.append(empty);
            return;
          }
          for (const article of articles) {
            const card = document.createElement('article');
            const title = document.createElement('h2');
            title.append(makeArticleLink(article));
            card.append(title);
            if (article.feed_title) {
              const feed = document.createElement('p');
              feed.className = 'feed';
              feed.textContent = article.feed_title;
              card.append(feed);
            }
            const excerpt = document.createElement('p');
            excerpt.textContent = readableText(
              article.summary || article.content,
            ).slice(0, 280);
            card.append(excerpt);
            card.append(createActionBar(database, scope, article, rerender));
            results.append(card);
          }
        }

        function renderReader(articles, database, scope) {
          results.replaceChildren();
          const id = decodeURIComponent(path.slice('/articles/'.length));
          const article = articles.find((item) => item.id === id);
          if (!article) {
            status.textContent = 'This article is unavailable offline.';
            return;
          }
          heading.textContent = article.title || 'Untitled story';
          if (!article.read) {
            queueOfflineAction(database, scope, article, 'read').catch(
              () => undefined,
            );
          }
          const body = document.createElement('div');
          body.className = 'article-body';
          renderRichBody(body, article.content || article.summary, article.url);
          const rerenderReader = () => renderReader(articles, database, scope);
          results.append(
            body,
            createActionBar(database, scope, article, rerenderReader),
          );
        }

        function renderDigest(digests) {
          const digest = digests.sort(
            (left, right) => right.updatedAt - left.updatedAt,
          )[0]?.payload;
          if (!digest) {
            status.textContent =
              'Open the digest while connected to keep a copy on this device.';
            return;
          }
          heading.textContent =
            digest.briefing?.headline || digest.headline || 'Offline digest';
          const summary = document.createElement('p');
          summary.textContent =
            digest.briefing?.summary || digest.summary || '';
          results.append(summary);
          const stories = document.createElement('ul');
          for (const item of digest.topStories || []) {
            if (!item.article?.id) continue;
            const story = document.createElement('li');
            story.append(makeArticleLink(item.article));
            stories.append(story);
          }
          results.append(stories);
        }

        openDatabase()
          .then(readLibrary)
          .then(({ database, scope, articles, digests }) => {
            const isOwned = (item) =>
              Boolean(scope) &&
              item.scope === scope &&
              item.cacheVersion === cacheVersion;
            const ownArticles = articles
              .filter(isOwned)
              .sort(
                (left, right) =>
                  (right.offline_rank_score ?? -Infinity) -
                    (left.offline_rank_score ?? -Infinity) ||
                  (right.published_at || right.fetched_at || 0) -
                    (left.published_at || left.fetched_at || 0),
              );
            status.textContent =
              'Showing cached content. Reconnect to refresh your feeds.';

            const renderCurrentRoute = () => {
              const visible = ownArticles.filter(isVisibleInFeed);
              if (path.startsWith('/articles/')) {
                renderReader(ownArticles, database, scope);
              } else if (path === '/digest') {
                renderDigest(digests.filter(isOwned));
              } else if (path === '/search') {
                document.getElementById('search-label').hidden = false;
                const needle = query.value.trim().toLowerCase();
                const filtered = visible.filter((article) =>
                  [
                    article.title,
                    article.feed_title,
                    readableText(article.content || article.summary),
                  ].some((value) =>
                    String(value || '')
                      .toLowerCase()
                      .includes(needle),
                  ),
                );
                status.textContent = `${filtered.length} cached ${filtered.length === 1 ? 'match' : 'matches'}`;
                renderArticles(filtered, database, scope, renderCurrentRoute);
              } else if (path === '/saved') {
                renderArticles(
                  ownArticles.filter((article) => article.saved),
                  database,
                  scope,
                  renderCurrentRoute,
                );
              } else if (path === '/recovery') {
                renderArticles(
                  ownArticles.filter(
                    (article) =>
                      article.cleared_at == null &&
                      (article.hidden || article.thumbs_down),
                  ),
                  database,
                  scope,
                  renderCurrentRoute,
                );
              } else if (path.startsWith('/feeds/')) {
                renderArticles(
                  visible.filter(
                    (article) =>
                      '/feeds/' + encodeURIComponent(article.feed_id) === path,
                  ),
                  database,
                  scope,
                  renderCurrentRoute,
                );
              } else {
                renderArticles(
                  path === '/inbox'
                    ? visible.filter((article) => !article.read)
                    : visible,
                  database,
                  scope,
                  renderCurrentRoute,
                );
              }
            };

            if (path === '/search') {
              query.value = new URLSearchParams(location.search).get('q') || '';
              query.addEventListener('input', renderCurrentRoute);
            }
            renderCurrentRoute();
          })
          .catch(() => {
            status.textContent =
              'The offline library could not be opened on this device.';
          });
      })();
    </script>
  </body>
</html>
